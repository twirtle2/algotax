<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2538"/>
      <stop offset="100%" style="stop-color:#151b2d"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00b894"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee5a5a"/>
    </linearGradient>
    <filter id="tealGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect width="100" height="100" rx="20" fill="none" stroke="#ffffff0d" stroke-width="1"/>

  <!-- 
    Icon concept: The Algorand "A" diamond shape morphed with a tax/filter funnel.
    Left half = teal (transactions in), right half = red (filtered out).
    A bold "A" triangle sits center, referencing ALGO.
  -->

  <!-- Background card glow -->
  <ellipse cx="50" cy="52" rx="28" ry="22" fill="#00d4aa" fill-opacity="0.05"/>

  <!-- Funnel / filter shape — represents filtering transactions -->
  <!-- Top bar -->
  <rect x="22" y="26" width="56" height="5" rx="2.5" fill="#2d3650"/>
  <!-- Mid bar -->
  <rect x="30" y="36" width="40" height="5" rx="2.5" fill="#2d3650"/>
  <!-- Narrow bar -->
  <rect x="38" y="46" width="24" height="5" rx="2.5" fill="#2d3650"/>

  <!-- Teal highlight on top bar (left portion = accepted) -->
  <rect x="22" y="26" width="30" height="5" rx="2.5" fill="url(#tealGrad)" fill-opacity="0.85" filter="url(#tealGlow)"/>
  <!-- Red on top bar (right = filtered) -->
  <rect x="53" y="26" width="25" height="5" rx="2.5" fill="url(#redGrad)" fill-opacity="0.7"/>

  <!-- Mid bar teal small portion -->
  <rect x="30" y="36" width="14" height="5" rx="2.5" fill="url(#tealGrad)" fill-opacity="0.7"/>

  <!-- Narrow bar full teal — what passes through -->
  <rect x="38" y="46" width="24" height="5" rx="2.5" fill="url(#tealGrad)" filter="url(#tealGlow)"/>

  <!-- Export arrow pointing down — the CSV export concept -->
  <line x1="50" y1="55" x2="50" y2="68" stroke="url(#tealGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#tealGlow)"/>
  <polyline points="43,63 50,71 57,63" fill="none" stroke="url(#tealGrad)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#tealGlow)"/>

  <!-- Small dot indicator at the bottom of arrow — exported file -->
  <rect x="39" y="73" width="22" height="3" rx="1.5" fill="#00d4aa" fill-opacity="0.3"/>

  <!-- "AT" monogram top-right corner, small -->
  <text x="76" y="19" font-size="8" font-family="'Arial', sans-serif" font-weight="700" fill="#00d4aa" fill-opacity="0.5" text-anchor="middle" letter-spacing="0.5">AT</text>

</svg>
